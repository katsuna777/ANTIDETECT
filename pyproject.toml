[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antidetect"
dynamic = ["version"]
description = "Antidetect browser — isolated Chrome profiles with a consistent, per-profile fingerprint"
requires-python = ">=3.12"
dependencies = [
    "PySide6-Essentials>=6.6",   # QtCore / QtGui / QtWidgets / QtSvg only — no WebEngine, no Addons
    "websocket-client>=1.8",
    "platformdirs>=4",
    "certifi>=2024.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3"]
build = ["pyinstaller>=6"]

[project.scripts]
antidetect = "antidetect.cli.main:main"
antidetect-gui = "antidetect.gui.app:main"

[tool.setuptools.dynamic]
version = { attr = "antidetect.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"antidetect.infrastructure.stealth" = ["js/*.js"]
"antidetect.gui.resources" = ["*.png", "*.ico", "*.icns"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
