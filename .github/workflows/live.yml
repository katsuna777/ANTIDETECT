name: Live browser checks

# Runs the real-Chrome tests (the fingerprint layer against a running browser) on every system the app
# supports, with the Chrome the app itself downloads. Slow and it needs the network, so it is not part of
# every push: run it by hand or let the weekly schedule do it.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  live:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      ANTIDETECT_LIVE_BROWSER: "1"
      ANTIDETECT_NO_SANDBOX: "1"          # hosted Linux runners restrict the user namespaces Chrome's sandbox needs
      # Hosted Windows and Linux runners have no GPU, and recent Chrome gives no WebGL at all without this
      # (macOS runners have one). The checks compare the GPU the page claims with what every realm reports.
      ANTIDETECT_CHROMIUM_ARGS: "--use-angle=swiftshader --enable-unsafe-swiftshader"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt6 system libraries and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libsm6 libice6 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Download Chrome with the app's own downloader
        run: antidetect browser download
      - name: Show which browser will run
        run: antidetect browser status
      - name: Stealth layer against the real browser (Linux)
        if: runner.os == 'Linux'
        run: |
          export ANTIDETECT_CHROMIUM_PATH="$(antidetect browser path)"
          xvfb-run -a pytest -q tests/infrastructure/stealth/test_stealth_cdp.py -k live
          xvfb-run -a pytest -q tests/api/test_live_api.py
      - name: Stealth layer against the real browser (macOS)
        if: runner.os == 'macOS'
        run: |
          export ANTIDETECT_CHROMIUM_PATH="$(antidetect browser path)"
          pytest -q tests/infrastructure/stealth/test_stealth_cdp.py -k live
          pytest -q tests/api/test_live_api.py
      - name: Stealth layer against the real browser (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ANTIDETECT_CHROMIUM_PATH = (antidetect browser path)
          pytest -q tests/infrastructure/stealth/test_stealth_cdp.py -k live
          pytest -q tests/api/test_live_api.py
