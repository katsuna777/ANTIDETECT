name: Build

# A build of every push to main, to download from the run's Artifacts. A real release is release.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      intel:
        description: Also build the Intel Mac app
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    needs: tests
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      intel: ${{ inputs.intel == true }}
