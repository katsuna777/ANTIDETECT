name: Release

# git tag v0.2.0 && git push origin v0.2.0  ->  tests, all three builds, a GitHub Release with the files.
# Run by hand (Actions -> Release -> Run workflow) it builds everything and publishes nothing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag must name the version in the code
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          code="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/antidetect/__init__.py)"
          tag="${GITHUB_REF_NAME#v}"
          echo "tag: $tag   __version__: $code"
          if [ -z "$code" ] || [ "$code" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ = \"$code\" in src/antidetect/__init__.py. Fix the version (or the tag) and tag again."
            exit 1
          fi

  tests:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [check-tag, tests]
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      intel: true
      retention-days: 1          # the release itself keeps the files

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: Antidetect-*
          merge-multiple: true
          path: artifacts
      - name: One checksum file
        working-directory: artifacts
        run: |
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          ls -l
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          body_path: .github/release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
